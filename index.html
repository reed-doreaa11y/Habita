<style>

*{box-sizing:border-box}

.ok{color:var(--done)}
.err{color:#d64545}
.gbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gbar i{display:block;height:100%;background:var(--accent)}
.book{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.logrow,.eform{display:flex;gap:8px;margin-top:10px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.path-card{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.path-stage{padding:10px 0;border-top:1px solid var(--line)}.path-stage:first-child{border-top:0}.path-stage small{display:block;color:var(--muted);margin-top:3px}.path-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.path-actions button{flex:1 1 42%}.path-area{margin-top:10px}.path-area textarea{min-height:130px}

main{padding-bottom:104px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

.jempty{min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 24px}.jempty .jdate{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.jempty p{color:var(--muted);margin:0;max-width:280px}.jhead h1{font-size:1.5rem}.jhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.jstreak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1rem;color:var(--muted)}.jstreak.on{color:var(--ink)}

.story{position:relative;width:100%;max-width:520px;height:100%;max-height:820px;overflow:hidden;color:#fff;display:flex;flex-direction:column;background:linear-gradient(160deg,hsl(var(--h) 60% 24%),hsl(calc(var(--h) + 40) 55% 10%));padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}

.sprog{display:flex;gap:4px;margin-right:48px}.sprog i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.28)}.sprog i.on{background:#fff}
