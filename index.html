<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1624"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Habita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--ink:#1b2a41;--muted:#6b7a90;--line:#d9e1ec;--accent:#2f5bea;--done:#1f9d6b;--done-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#182237;--ink:#e8eef9;--muted:#8d9bb3;--line:#2a3750;--accent:#7b9cff;--done:#3cc590;--done-ink:#0f1624}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#182237;--ink:#e8eef9;--muted:#8d9bb3;--line:#2a3750;--accent:#7b9cff;--done:#3cc590;--done-ink:#0f1624}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:1.25rem;font-weight:800}
.sub{color:var(--muted);margin:4px 0 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.gtitle{font-size:1.2rem;font-weight:800}
.why{margin:2px 0 0;color:var(--muted);font-size:.9rem;font-style:italic}
.head,.row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:center}
.head{padding:10px 0 6px;color:var(--muted);font-size:.8rem;text-align:center}
.head span.today{color:var(--accent);font-weight:800}
.row{padding:12px 0;border-top:1px solid var(--line);row-gap:10px}
.row .name{grid-column:1/-1}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.streak{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.streak.on{color:var(--done)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--done-ink);cursor:pointer;padding:0;justify-self:center;font:inherit;font-size:.85rem;font-weight:800}
.dot:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dot.on{background:var(--done);border-color:var(--done)}
.dot.today{border-color:var(--accent)}
.dot.on.today{border-color:var(--done)}
.empty{padding:20px 0;text-align:center;color:var(--muted)}
input[type=text],input[type=number],select,textarea{flex:1;min-width:0;width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=checkbox]{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
button.primary{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer}
button.wide{width:100%}
.tools{display:flex;justify-content:flex-end;margin-top:12px}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;padding:4px 0}
.del{background:none;border:0;color:#d64545;font:inherit;font-size:.8rem;cursor:pointer;padding:2px 0}
.lbl{font-weight:600;display:block;margin:14px 0 8px}
.chips,.opts{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.opts button{font:inherit;font-weight:600;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button.sel{border-color:var(--accent);color:var(--accent)}
.opts button{flex:1 1 45%;text-align:left}
.pick{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.pick small{display:block;color:var(--muted);font-weight:400}
.pick span{font-weight:600}
.clock{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 14px}
.mins{display:flex;gap:8px;margin:12px 0}
.mins button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mins button.sel{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);margin:10px 0 0;font-size:.9rem;text-align:center}
.note.left{text-align:left;margin:6px 0 0}
.ok{color:var(--done)}
.err{color:#d64545}
.gbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gbar i{display:block;height:100%;background:var(--accent)}
.book{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.logrow,.eform{display:flex;gap:8px;margin-top:10px}
.btnrow{display:flex;gap:8px;align-items:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.plan-grid{display:grid;gap:10px;margin-top:10px}.plan-goal{display:flex;gap:8px;align-items:center}.plan-goal input{min-width:0}.mini{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:8px}.priority{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:800;margin-right:6px}.priority.primary{background:var(--accent);color:#fff}.priority.support{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}.priority.maintain{background:var(--line);color:var(--ink)}.priority.later{background:var(--line);color:var(--muted)}.plan-note{padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:8px;color:var(--muted);font-size:.9rem}.plan-list{display:grid;gap:10px}.plan-item{border-top:1px solid var(--line);padding-top:10px}.plan-item:first-child{border-top:0;padding-top:0}.plan-item strong{display:block}.plan-meta{font-size:.85rem;color:var(--muted);margin-top:3px}.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.plan-summary{font-size:.95rem}.question{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.question:first-child{border-top:0;padding-top:0;margin-top:0}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.time-grid input{width:100%}.schedule{display:grid;gap:8px}.schedule-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:10px}.schedule-row strong{font-size:.9rem}.schedule-row span{color:var(--muted);font-size:.85rem;text-align:right}.date-row{display:flex;gap:8px;align-items:center}.date-row input{flex:1}

main{padding-bottom:104px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:600}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.ttime{width:44px;flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tmain{min-width:0;flex:1}
.check{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--done-ink);cursor:pointer;padding:0;font:inherit;font-size:1rem;font-weight:800}
.check.on{background:var(--done);border-color:var(--done)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;background:var(--line);color:var(--ink)}
.badge.primary{background:var(--accent);color:#fff}
.badge.support{background:var(--done);color:var(--done-ink)}
.notice{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--accent)}
.notice p{margin:0;flex:1}
.dot.off{opacity:.35}
.hlist{list-style:none;margin:8px 0 0;padding:0}
.hlist li{padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.hlist li:first-child{border-top:0}
.hlist small{display:block;color:var(--muted)}
.pitem{border-top:1px solid var(--line);padding:12px 0}
.pitem:first-of-type{border-top:0}
.pitem h3{margin:0 0 4px;font-size:1.05rem}
.pitem p{margin:2px 0;color:var(--muted);font-size:.9rem}
.sect{font-weight:800;margin:16px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{resize:vertical;min-height:120px}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:#f5b301;border:2px solid #d99a00;vertical-align:-.12em;margin-right:6px}
button,input,select,textarea,label{scroll-margin-bottom:104px}
.time-in{width:auto;max-width:130px;padding:6px 8px;margin-top:6px}
</style>
</head>
<body>
<main><div id="view"></div></main>
<nav aria-label="Main">
<button type="button" data-act="nav" data-v="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
<button type="button" data-act="nav" data-v="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Habits</button>
<button type="button" data-act="nav" data-v="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
<button type="button" data-act="nav" data-v="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v16M11 9h5"/></svg>Journal</button>
<button type="button" data-act="nav" data-v="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>
<script>
var $=function(i){return document.getElementById(i)};
var PPM=0.5,KEY="habita-v2",OLD="habit-tracker-v1",editing=false,wiz=null,planner=null,view="home";

/* ---------- starter library (k = shared habit that serves several goals) ---------- */
var LIB={
 confident:{name:"Be confident",obs:["Fear of judgment","Overthinking","Low energy","Don't know where to start"],habits:[
  {n:"Stand tall for 1 minute",a:"After brushing your teeth",m:1,o:["Low energy","Don't know where to start"]},
  {n:"Say hello first to someone",a:"When you meet someone today",m:1,o:["Fear of judgment"]},
  {n:"Take 5 slow breaths",a:"Before something nerve-racking",m:2,o:["Overthinking","Fear of judgment"],k:"breathe"},
  {n:"Say one thing out loud in a conversation or meeting",a:"At your next meeting or chat",m:2,o:["Fear of judgment"]},
  {n:"Write down one thing you did well",a:"Before bed",m:2,o:["Overthinking","Fear of judgment"]},
  {n:"Do one small thing that scares you a little",a:"Before lunch",m:5,o:["Fear of judgment","Overthinking"]},
  {n:"Read or speak out loud for 5 minutes",a:"After coffee",m:5,o:["Don't know where to start","Low energy"]}]},
 reading:{name:"Read more",obs:["Phone pulls me away","No time","Get bored","Forget to do it"],habits:[
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["Phone pulls me away"],k:"phone-charge"},
  {n:"Read 1 page",a:"In bed, before sleep",m:1,o:["Get bored","Forget to do it","Phone pulls me away"]},
  {n:"Put your book where you will see it",a:"Every morning",m:1,o:["Forget to do it"]},
  {n:"Write one line about what you read",a:"After you read",m:2,o:["Get bored"]},
  {n:"Read 5 minutes instead of scrolling",a:"When you reach for your phone",m:5,o:["Phone pulls me away","No time"]},
  {n:"Read for 10 minutes",a:"After dinner",m:10,o:["Phone pulls me away","Forget to do it"]}]},
 fitness:{name:"Get fitter",obs:["No energy","No time","Get bored","Forget to do it"],habits:[
  {n:"Put on your workout clothes",a:"First thing after waking up",m:1,o:["No energy","Forget to do it"]},
  {n:"Drink a glass of water",a:"Before each meal",m:1,o:["Forget to do it"]},
  {n:"Do 10 squats or push-ups",a:"After brushing your teeth",m:2,o:["No time","Forget to do it"]},
  {n:"Stretch for 3 minutes",a:"Before bed",m:3,o:["No energy","Forget to do it"]},
  {n:"Do 5 minutes of movement",a:"After coffee",m:5,o:["No time","No energy"]},
  {n:"Walk for 10 minutes",a:"After lunch",m:10,o:["Get bored","No energy"],k:"walk"}]},
 focus:{name:"Focus better",obs:["My phone","Overwhelmed","Tired","Don't know where to start"],habits:[
  {n:"Close extra tabs and apps",a:"Before you start",m:1,o:["My phone","Overwhelmed"]},
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["My phone"],k:"phone-charge"},
  {n:"Write the one thing that matters today",a:"First thing, with coffee",m:2,o:["Overwhelmed","Don't know where to start"]},
  {n:"Write tomorrow's top task and worries down",a:"30 minutes before bed",m:3,o:["Overwhelmed","Don't know where to start"],k:"plan-tomorrow"},
  {n:"Take a real 5-minute break away from screens",a:"After each work block",m:5,o:["Tired"]},
  {n:"Work in a 10-minute sprint",a:"Once the first task is open",m:10,o:["Tired","Don't know where to start"]},
  {n:"Walk for 10 minutes",a:"After lunch",m:10,o:["Tired"],k:"walk"},
  {n:"Phone in another room for 25 minutes",a:"When you start work",m:25,o:["My phone"]}]},
 sleep:{name:"Sleep better",obs:["Phone in bed","Racing thoughts","Irregular schedule","Caffeine late"],habits:[
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["Phone in bed"],k:"phone-charge"},
  {n:"Lights low and screens off",a:"30 minutes before bed",m:1,o:["Phone in bed","Irregular schedule"]},
  {n:"Get into bed at the same time",a:"Same time every night",m:1,o:["Irregular schedule"]},
  {n:"No caffeine after lunch",a:"After lunch",m:1,o:["Caffeine late"]},
  {n:"Take 5 slow breaths",a:"After getting into bed",m:2,o:["Racing thoughts"],k:"breathe"},
  {n:"Write tomorrow's top task and worries down",a:"30 minutes before bed",m:3,o:["Racing thoughts"],k:"plan-tomorrow"}]}
};
var LEARN_OBS=["Don't know where to start","Lose motivation","Phone","Forget to do it"];
var LEARN=[
 {n:"Open your materials and start (just 5 minutes)",a:"At your study time",m:5,o:["Don't know where to start","Lose motivation"],k:"learn-open"},
 {n:"Put your phone away while you study",a:"When you start studying",m:1,o:["Phone"],k:"learn-phone"},
 {n:"Review yesterday's notes",a:"Before you start new material",m:5,o:["Forget to do it"],k:"learn-review"},
 {n:"Do one practice problem or exercise",a:"After you open your materials",m:10,o:["Lose motivation","Don't know where to start"],k:"learn-practice"},
 {n:"Write a 3-line summary of what you learned",a:"After you study",m:3,o:["Forget to do it","Lose motivation"],k:"learn-summary"}];
var GEN_OBS=["Don't know where to start","No time","Forget to do it","Lose motivation"];
var MONEY=[
 {n:"Write down what you spent today",a:"Before bed",m:2,o:["Forget to do it","No time"]},
 {n:"Check your budget for 2 minutes",a:"After breakfast",m:2,o:["Don't know where to start","Forget to do it"]},
 {n:"Move a small amount to savings",a:"When you get paid",m:2,o:["Lose motivation"]},
 {n:"Note one idea to earn more",a:"After lunch",m:5,o:["Don't know where to start","Lose motivation"]}];
function genPool(n){return[
 {n:"Spend 2 minutes on it, no more",a:"After coffee",m:2,o:["No time","Lose motivation"]},
 {n:"Set out what you need for tomorrow",a:"Before bed",m:2,o:["Forget to do it","No time"]},
 {n:"Write one line about how it went",a:"Before bed",m:2,o:["Lose motivation","Forget to do it"]},
 {n:"Tell someone what you did today",a:"In the evening",m:2,o:["Lose motivation"]},
 {n:"Take one small step toward: "+n,a:"After breakfast",m:5,o:["Don't know where to start","Lose motivation"]},
 {n:"Work on it for 10 minutes",a:"After lunch",m:10,o:["Don't know where to start"]}]}
var OBSMAP=[[/forget|remember/,["Forget to do it"]],[/phone|scroll|distract/,["Phone pulls me away","My phone","Phone in bed","Phone"]],[/tired|energy|exhaust/,["Low energy","No energy","Tired"]],[/time|busy/,["No time"]],[/bored/,["Get bored"]],[/overplan|overwhelm|too much/,["Overwhelmed","Overthinking"]],[/motivat|give up|quit|lazy|consisten/,["Lose motivation"]],[/start/,["Don't know where to start"]]];
function matchObs(t,list){t=(t||"").toLowerCase();for(var i=0;i<OBSMAP.length;i++)if(OBSMAP[i][0].test(t))for(var j=0;j<OBSMAP[i][1].length;j++)if(list.indexOf(OBSMAP[i][1][j])>=0)return OBSMAP[i][1][j];return""}
function planKeyword(name){var x=name.toLowerCase();
 if(/\b(sleep|bed|rest)/.test(x))return{kind:"sleep",lib:"sleep"};
 if(/\b(money|save|saving|business|freelanc|income|earn)/.test(x))return{kind:"money"};
 if(/\b(exercise|fitness|fit|workout|gym|run|weight)/.test(x))return{kind:"fitness",lib:"fitness"};
 if(/\b(read|book)/.test(x))return{kind:"reading",lib:"reading"};
 if(/confiden|\b(shy|speak|social)/.test(x))return{kind:"confident",lib:"confident"};
 if(/\b(focus|concentrat|procrastinat|distract)/.test(x))return{kind:"focus",lib:"focus"};
 if(/\b(stat|exam|test|course|study|school|learn|python|revit|autocad|skill|certif)/.test(x))return{kind:"learning"};
 return{kind:"other"}}
function poolFor(info,name){return info.lib?LIB[info.lib].habits:info.kind=="learning"?LEARN:info.kind=="money"?MONEY:genPool(name)}
function obsList(info){return info.lib?LIB[info.lib].obs:info.kind=="learning"?LEARN_OBS:GEN_OBS}
function rank(pool,mins,obs){var p=pool.map(function(h){return Object.assign({},h)}),fit=p.filter(function(h){return h.m<=mins});
 if(fit.length<3)fit=p.slice().sort(function(a,b){return a.m-b.m}).slice(0,3);
 fit.forEach(function(h,i){h._s=((h.o||[]).indexOf(obs)>=0?10:0)-i*0.01});
 return fit.sort(function(a,b){return b._s-a._s})}

/* ---------- state ---------- */
function load(){
 var s=null;
 try{var r=localStorage.getItem(KEY);if(r){s=JSON.parse(r);if(!(s&&s.goals))s=null}}catch(e){}
 if(!s){s={goals:[],mins:{}};
  try{var o=JSON.parse(localStorage.getItem(OLD)||"null");if(o){s.mins=o.mins||{};
   if((o.habits||[]).length)s.goals.push({id:"g0",name:"My habits",why:"",mins:10,book:null,habits:o.habits.map(function(h){return{id:h.id,name:h.name,anchor:"",done:h.done||{}}})});
   (o.goals||[]).forEach(function(g){s.goals.push({id:g.id,name:g.name,why:"",mins:g.mins||20,book:{title:g.name,total:g.total,read:g.read},habits:[]})})}}catch(e){}}
 if(!s.mins)s.mins={};if(!s.notices)s.notices=[];if(!s.journal)s.journal={};if(!s.theme)s.theme="auto";
 s.goals.forEach(function(g){if(!g.habits)g.habits=[];if(!g.queue)g.queue=[];g.habits.forEach(function(h){if(!h.also)h.also=[];if(!h.done)h.done={}})});
 if(!s.days)s.days={};if(!s.day)s.day={};if(!s.ach)s.ach={};if(!s.spent)s.spent=0;
 if(!s.start&&s.goals.length){var m="";s.goals.forEach(function(g){g.habits.forEach(function(h){Object.keys(h.done||{}).forEach(function(k){if(!m||k<m)m=k})})});s.start=m||key(daysBack(0))}
 return s}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBack(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d}
function addDays(d,n){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nice(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function addMinutes(t,m){var a=t.split(":").map(Number),d=new Date(2000,0,1,a[0],a[1]+m);return d.toTimeString().slice(0,5)}
function inRange(t,a,b){if(!a||!b)return false;var x=+t.replace(":",""),s=+a.replace(":",""),e=+b.replace(":","");return s<=e?x>=s&&x<e:x>=s||x<e}
function prof(){return Object.assign({dayStart:"07:00",sleepTime:"22:30",busyStart:"08:00",busyEnd:"16:00",studyTime:"18:00",exerciseTime:"17:00",mealMins:60},state.profile||{})}
function slotOf(a,n){var x=((a||"")+" "+(n||"")).toLowerCase();
 if(/bed|sleep|night|wind/.test(x))return"night";if(/lunch|midday|noon/.test(x))return"midday";
 if(/wak|morning|breakfast|coffee|brush/.test(x))return"morning";if(/dinner|evening|after work|after you study/.test(x))return"evening";return""}
function timeFor(slot,pp){pp=pp||prof();return slot=="morning"?addMinutes(pp.dayStart,30):slot=="midday"?"12:30":slot=="evening"?"19:30":slot=="night"?addMinutes(pp.sleepTime,-30):""}
function mkHabit(src,over){return Object.assign({id:uid(),name:src.n,anchor:src.a||"",done:{},time:src.time||timeFor(slotOf(src.a,src.n)),days:null,k:src.k||"",also:[],m:src.m||0,block:src.block||0,base:src.base||"",created:key(daysBack(-1))},over||{})}
function sched(h,d){if(h.p&&planMin(h,key(d))===0)return false;return !h.days||h.days.indexOf(d.getDay())>=0}
function streak(h){var n=0,i=h.done[key(daysBack(0))]?0:1;while(i<400){var d=daysBack(i);if(!sched(h,d)){i++;continue}if(h.done[key(d)]){n++;i++}else break}return n}
function allHabits(){var a=[];state.goals.forEach(function(g){g.habits.forEach(function(h){a.push({g:g,h:h})})});return a}
function findH(id){return allHabits().find(function(x){return x.h.id==id})}

function goalHabits(g){var o=g.habits.slice();state.goals.forEach(function(x){if(x!==g)x.habits.forEach(function(h){if(h.also&&h.also.indexOf(g.id)>=0)o.push(h)})});return o}
function ratioOf(hs){var dn=0,tot=0;hs.forEach(function(h){for(var i=0;i<7;i++){var d=daysBack(i);if(sched(h,d)){tot++;if(h.done[key(d)])dn++}}});return tot?dn/tot:0}
function helpNames(x){return [x.g.name].concat((x.h.also||[]).map(function(id){var g=goalById(id);return g?g.name:""}).filter(Boolean))}
function needDays(g){var b=g.book;return Math.ceil(Math.max(0,b.total-b.read)/(Math.max(1,g.mins)*PPM)*1.2)}
function dayLabel(days){if(!days)return"Daily";var n=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];return days.map(function(d){return n[d]}).join(", ")}
function note(t){state.notices.push({id:uid(),t:t});if(state.notices.length>5)state.notices.shift()}


/* ---------- coins, streaks, achievements ---------- */
var COMPLETE=state.threshold||0.75,COINS=5;
function needFor(n){return Math.max(1,Math.ceil(COMPLETE*n-1e-9))}
function isPast(k){return k<key(daysBack(0))}
function computeFlag(k){var d=new Date(k+"T12:00:00"),hs=allHabits().filter(function(x){return (x.h.created||state.start||k)<=k&&sched(x.h,d)});
 if(!hs.length)return false;return hs.filter(function(x){return x.h.done[k]}).length/hs.length>=COMPLETE}
function flag(k){if(!state.start||k<state.start)return false;return isPast(k)?!!state.days[k]:computeFlag(k)}
function eachDay(fn){if(!state.start)return;var d=new Date(state.start+"T12:00:00"),t=key(daysBack(0));for(var i=0;i<900;i++){var k=key(d);if(k>t)break;fn(k);d.setDate(d.getDate()+1)}}
function finalizeDays(){var y=key(daysBack(1));eachDay(function(k){if(k<=y&&state.days[k]==null)state.days[k]=computeFlag(k)?1:0})}
function earned(){var n=0;eachDay(function(k){if(flag(k))n++});return n*COINS}
function balance(){return Math.max(0,earned()-(state.spent||0))}
function curStreak(){if(!state.start)return 0;var i=flag(key(daysBack(0)))?0:1,n=0;while(i<900&&flag(key(daysBack(i)))){n++;i++}return n}
function bestStreak(){var b=0,r=0;eachDay(function(k){if(flag(k)){r++;if(r>b)b=r}else r=0});return b}
function stageDone(g){var n=0;if(!g.activated)return 0;eachDay(function(k){if(k>=g.activated&&flag(k))n++});return n}
function award(id,t){if(state.ach[id])return false;state.ach[id]={t:t,d:key(daysBack(0))};note("Achievement unlocked: "+t);return true}
function checkAch(){var b=bestStreak();
 [[7,"7-day streak"],[21,"21-day streak"],[30,"30-day streak"]].forEach(function(a){if(b>=a[0])award("s"+a[0],a[1])});
 state.goals.forEach(function(g){if(!g.locked&&g.activated&&g.stage&&!g.finished&&stageDone(g)>=g.stage){
  g.finished=key(daysBack(0));g.role="Complete";award("done-"+g.id,"Stage complete: "+g.name);note("Big win! You finished the stage for "+g.name+"."+(g.reward?" Your reward: "+g.reward:""))}})}

/* ---------- weekly plan review ---------- */
function gInfo(g){return g.lib?{lib:g.lib,kind:g.lib}:planKeyword(g.name)}
function rateOf(h){var dn=0,t=0;for(var i=0;i<7;i++){var d=daysBack(i);if(sched(h,d)){t++;if(h.done[key(d)])dn++}}return t?dn/t:0}
function buildProposal(){
 var c=0;for(var i=0;i<7;i++)if(flag(key(daysBack(i))))c++;
 var up=c>=5,down=c<=2;if(!up&&!down)return null;
 var ch=[],week=key(daysBack(7)),cand=allHabits().filter(function(x){return !x.g.locked&&(x.h.created||state.start)<=week});
 cand.forEach(function(x){x.r=rateOf(x.h)});
 cand.sort(function(a,b){return up?b.r-a.r:a.r-b.r});
 if(up){
  cand.forEach(function(x){if(x.h.block&&x.r>=0.8&&ch.length<1){var to=Math.min(120,x.h.block+15);if(to!==x.h.block)ch.push({type:"block",gid:x.g.id,hid:x.h.id,to:to,label:x.h.base+": "+x.h.block+" min \u2192 "+to+" min",on:true})}});
  var goals={};cand.forEach(function(x){if(!goals[x.g.id])goals[x.g.id]={g:x.g,r:[]};goals[x.g.id].r.push(x.r)});
  var best=Object.keys(goals).map(function(k){var o=goals[k];o.avg=o.r.reduce(function(a,b){return a+b},0)/o.r.length;return o}).filter(function(o){return o.avg>=0.8&&o.g.habits.length<4}).sort(function(a,b){return b.avg-a.avg})[0];
  if(best){var taken=allHabits().map(function(y){return y.h.k}).filter(Boolean),names=best.g.habits.map(function(y){return y.name}).concat((best.g.queue||[]).map(function(y){return y.n}));
   var opt=rank(poolFor(gInfo(best.g),best.g.name),15,"").filter(function(p){return names.indexOf(p.n)<0&&!(p.k&&taken.indexOf(p.k)>=0)})[0];
   if(opt)ch.push({type:"add",gid:best.g.id,to:{n:opt.n,a:opt.a,m:opt.m,k:opt.k||""},label:"Add to "+best.g.name+": "+opt.n,on:true})}}
 else{
  cand.forEach(function(x){if(x.h.block&&x.r<0.5&&ch.length<1){var to=Math.max(30,x.h.block-15);if(to!==x.h.block)ch.push({type:"block",gid:x.g.id,hid:x.h.id,to:to,label:x.h.base+": "+x.h.block+" min \u2192 "+to+" min",on:true})}});
  var pz=0;cand.forEach(function(x){if(pz<2&&!x.h.block&&x.r<0.5&&x.g.habits.length>1){pz++;ch.push({type:"pause",gid:x.g.id,hid:x.h.id,label:"Pause \""+x.h.name+"\" (it returns later)",on:true})}})}
 return ch.length?{kind:up?"up":"down",days:c,changes:ch}:null}
function checkReview(){var r=state.review;if(!r||!r.next||state.proposal)return;if(r.next>key(daysBack(0)))return;
 var p=buildProposal();if(p)state.proposal=p;else r.next=key(addDays(new Date(),7))}
function applyProposal(){var p=state.proposal;if(!p)return;var n=0;
 p.changes.forEach(function(c){if(!c.on)return;var g=goalById(c.gid);if(!g)return;
  if(c.type=="add"){g.habits.push(mkHabit(c.to));n++;return}
  var i=g.habits.findIndex(function(h){return h.id==c.hid});if(i<0)return;var h=g.habits[i];
  if(c.type=="block"){h.block=c.to;h.m=c.to;h.name=h.base+" ("+c.to+" min)";n++}
  else if(c.type=="pause"&&g.habits.length>1){g.habits.splice(i,1);g.queue.unshift({n:h.name,a:h.anchor,m:h.m,k:h.k,time:h.time,also:h.also||[]});n++}});
 state.proposal=null;state.review.next=key(addDays(new Date(),7));note(n?"Plan updated: "+n+(n==1?" change":" changes")+" applied.":"Nothing was changed.");save();render()}

/* ---------- weekly unlock ---------- */
function checkUnlock(){
 var u=state.unlock;if(!u||!u.next)return false;if(u.next>key(daysBack(0)))return false;
 var waiting=state.goals.filter(function(g){return g.queue&&g.queue.length&&!g.locked});
 if(!waiting.length){u.next=key(addDays(new Date(),7));save();return false}
 var next=key(addDays(new Date(),7));
 if(ratioOf(allHabits().map(function(x){return x.h}))<0.4){note("Holding steady this week. A new habit unlocks once your current ones feel easier (about 40% of check-ins done).");u.next=next;save();return true}
 waiting.sort(function(a,b){return (a.habits.length?1:0)-(b.habits.length?1:0)});
 for(var i=0;i<waiting.length;i++){var g=waiting[i];
  while(g.queue.length){var q=g.queue.shift(),ex=q.k&&allHabits().find(function(x){return x.h.k==q.k});
   if(ex){if(ex.g.id!=g.id&&ex.h.also.indexOf(g.id)<0)ex.h.also.push(g.id);continue}
   g.habits.push(mkHabit(q,{also:q.also||[]}));note("New habit unlocked for "+g.name+": "+q.n);u.next=next;save();return true}}
 u.next=next;save();return false}

 if(a=="stage1")setupStage1();
 else if(a=="dtype"){state.day[tk]={t:t.dataset.v,light:(state.day[tk]||{}).light};save();render()}
 else if(a=="light"){var d=state.day[tk]||{t:"open"};state.day[tk]={t:d.t,light:!d.light};save();render()}
 else if(a=="logmin"){var x=findH(t.dataset.h),i=$("lm-"+t.dataset.h),v=i?parseInt(i.value,10):0;if(!x||!(v>0))return;
  x.h.log=x.h.log||{};x.h.log[tk]=(x.h.log[tk]||0)+v;state.mins[tk]=(state.mins[tk]||0)+v;
  if(x.h.log[tk]>=planMin(x.h,tk))x.h.done[tk]=1;save();render()}},true);

/* ---------- render + events ---------- */
function applyTheme(){var r=document.documentElement;if(state.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",state.theme)}
function render(){
 refresh();
 var t={home:"Habita",habits:"Habits",goals:"Goals",journal:"Journal",more:"More"}[view],h='<h1>'+t+'</h1>';
 h+=view=="home"?homeHTML():view=="habits"?habitsHTML():view=="goals"?goalsHTML():view=="journal"?journalHTML():moreHTML();
 $("view").innerHTML=h;
 if(view=="habits")renderTimer();
 Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){var on=b.dataset.v==view;b.className=on?"on":"";if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
document.addEventListener("input",function(e){var t=e.target,id=t.id,v=t.value;
 if(id=="jText"){var tk=key(daysBack(0));if(v.trim())state.journal[tk]=v;else delete state.journal[tk];save();return}
 if(planner){if(t.dataset.pgoal!=null)planner.goals[+t.dataset.pgoal]=v;else if(t.dataset.pf)planner[t.dataset.pf]=v;return}
 if(!wiz)return;
 if(id=="wName")wiz.name=v;else if(id=="wWhy")wiz.why=v;else if(id=="wTitle")wiz.title=v;else if(id=="wTotal")wiz.total=v;else if(id=="wOwn")wiz.own=v});
document.addEventListener("change",function(e){var t=e.target;
 if(wiz&&wiz.step==3&&t.dataset&&t.dataset.i!=null){wiz.picks[+t.dataset.i]=t.checked;return}
 if(t.dataset&&t.dataset.gs){var gg=goalById(t.dataset.gs);if(gg){gg.stage=Math.max(7,Math.min(365,parseInt(t.value,10)||21));save();render()}return}
 if(t.dataset&&t.dataset.gr){var gr=goalById(t.dataset.gr);if(gr){gr.reward=t.value;save()}return}
 if(t.dataset&&t.dataset.pc!=null&&state.proposal){state.proposal.changes[+t.dataset.pc].on=t.checked;save();return}
 if(t.dataset&&t.dataset.ht){var x=findH(t.dataset.ht);if(x){x.h.time=t.value;save()}return}
 if(t.id=="impFile"&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var s=JSON.parse(fr.result);if(!s||!Array.isArray(s.goals))throw 0;if(confirm("Replace your current data with this backup?")){localStorage.setItem(KEY,JSON.stringify(s));state=load();applyTheme();render()}}catch(err){var m=$("impMsg");if(m)m.textContent="That file is not a Habita backup."}};fr.readAsText(t.files[0])}});
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act,d=t.dataset;
 if(a=="nav"){view=d.v;window.scrollTo(0,0);render();return}
 if(a=="dismiss"){state.notices=state.notices.filter(function(n){return n.id!=d.id});save();render();return}
 if(a=="gotoplan"){view="goals";startPlanner();render();return}
 if(a=="edit"){editing=!editing;render();return}
 if(a=="thr"){state.threshold=+d.v/100;COMPLETE=state.threshold;save();render();return}
 if(a=="theme"){state.theme=d.v;applyTheme();save();render();return}
 if(a=="export"){var b=new Blob([JSON.stringify(state)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="habita-backup.json";document.body.appendChild(l);l.click();l.remove();return}
 if(a=="import"){$("impFile").click();return}
 if(a=="reset"){if(confirm("Delete all goals, habits, and journal entries? This cannot be undone.")){try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(err){}state=load();wiz=null;planner=null;render()}return}
 if(a=="plan"){startPlanner();render();return}
 if(a=="pcancel"){planner=null;render();return}
 if(a=="padd"){planner.goals.push("");render();return}
 if(a=="premove"){planner.goals.splice(+d.i,1);render();return}
 if(a=="pquestions"){planner.goals=planner.goals.map(function(x){return x.trim()}).filter(Boolean);if(!planner.goals.length){planner.goals=[""];render();return}planner.step=2;render();return}
 if(a=="penergy"){planner.energy=d.v;render();return}
 if(a=="pgenerate"){planner.result=buildPlan(planner);planner.step=3;render();return}
 if(a=="pback"){planner.step=planner.step==3?2:1;render();return}
 if(a=="papply"){applyPlan();return}
 if(a=="pcapply"){applyProposal();return}
 if(a=="pckeep"){state.proposal=null;if(state.review)state.review.next=key(addDays(new Date(),7));note("Kept your current plan.");save();render();return}
 if(a=="unlockg"){var gu=goalById(d.g),cu=gu?COINS*(gu.stage||21):0;
  if(gu&&gu.locked&&balance()>=cu){state.spent=(state.spent||0)+cu;gu.locked=false;gu.activated=key(daysBack(0));gu.role="Supporting";var got=0;
   while(gu.queue.length&&got<2){var q=gu.queue.shift(),ex=q.k&&allHabits().find(function(z){return z.h.k==q.k});
    if(ex){if(ex.g.id!=gu.id&&ex.h.also.indexOf(gu.id)<0)ex.h.also.push(gu.id);continue}
    gu.habits.push(mkHabit(q,{also:q.also||[]}));got++}
   note("Unlocked: "+gu.name+".");award("unlock-"+gu.id,"Unlocked "+gu.name);save();render()}return}
 if(a=="tog"){var x=findH(d.h);if(x){if(x.h.done[d.k])delete x.h.done[d.k];else x.h.done[d.k]=1;if(state.start&&isPast(d.k))state.days[d.k]=computeFlag(d.k)?1:0;save();render()}}
 else if(a=="delh"){var y=findH(d.h);if(y&&confirm('Delete "'+y.h.name+'"?')){y.g.habits=y.g.habits.filter(function(h){return h!==y.h});save();render()}}
 else if(a=="delg"){var g=goalById(d.g);if(g&&confirm('Delete "'+g.name+'" and its habits?')){state.goals=state.goals.filter(function(z){return z!==g});save();render()}}
 else if(a=="addh"){var g2=goalById(d.g),i=$("ah-"+d.g),v=i&&i.value.trim();if(g2&&v){g2.habits.push(mkHabit({n:v,a:""}));save();render()}}
 else if(a=="logp"){var g3=goalById(d.g),n=parseInt($("lp-"+d.g).value,10);if(g3&&g3.book&&n>0){g3.book.read=Math.min(g3.book.total,g3.book.read+n);save();render()}}
 else if(a=="newg"){wiz={step:1,lib:null,name:"",why:"",mins:10,obs:"",title:"",total:"",own:"",sug:[],picks:[],err:""};render()}
 else if(a=="cancel"){wiz=null;render()}
 else if(a=="pick"){if(d.k=="custom"){wiz.lib="custom";wiz.name=""}else{wiz.lib=d.k;wiz.name=LIB[d.k].name;wiz.step=2}wiz.err="";render()}
 else if(a=="nameok"){if(!wiz.name.trim()){wiz.err="Give your goal a name first.";render();return}wiz.name=wiz.name.trim();wiz.step=2;wiz.err="";render()}
 else if(a=="mins"){wiz.mins=+d.v;render()}
 else if(a=="obs"){wiz.obs=wiz.obs==d.v?"":d.v;render()}
 else if(a=="sug"){wiz.sug=suggest(wiz);wiz.picks=wiz.sug.map(function(){return true});wiz.step=3;wiz.err="";render()}
 else if(a=="back"){if(wiz.step==3)wiz.step=2;else if(wiz.step==2)wiz.step=1;else if(wiz.lib=="custom")wiz.lib=null;else wiz=null;if(wiz)wiz.err="";render()}
 else if(a=="create"){
  var hs=wiz.sug.filter(function(s,i){return wiz.picks[i]}).map(function(s){return mkHabit(s,{created:key(daysBack(0))})});
  if(wiz.own.trim())hs.push(mkHabit({n:wiz.own.trim(),a:""},{created:key(daysBack(0))}));
  if(!hs.length){wiz.err="Pick at least one habit, or add your own.";render();return}
  var tot=parseInt(wiz.total,10);
  state.start=state.start||key(daysBack(0));if(!state.review)state.review={next:key(addDays(new Date(),7))};
  state.goals.push({id:uid(),name:wiz.name,why:wiz.why.trim(),mins:wiz.mins,role:"",queue:[],lib:wiz.lib!="custom"?wiz.lib:"",stage:21,reward:"",locked:false,activated:key(daysBack(0)),book:wiz.lib=="reading"&&tot>0?{title:wiz.title.trim(),total:tot,read:0}:null,habits:hs});
  wiz=null;save();render()}
});
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
applyTheme();render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
