color-mix(in srgb,var(--accent) 5%,transparent);border-radius:10px}.schedule-row strong{font-size:.9rem}.schedule-row span{color:var(--muted);font-size:.85rem;text-align:right}.date-row{display:flex;gap:8px;align-items:center}.date-row input{flex:1}.daily-goal-list{margin-top:10px}.daily-goal-list .trow{border-top:1px solid var(--line);padding:10px 0}.daily-goal-list .trow:first-child{border-top:0}.daily-goal-list .mini{font-size:1.3rem}.period-badge{display:flex;align-items:center;gap:7px;background:#dce8f8;color:#24466f;border-radius:14px;padding:8px 11px;font-weight:700;white-space:nowrap}.home-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 24px}.home-date{font-size:1.05rem;font-weight:650;letter-spacing:-.02em}.home-habit-list{margin-top:4px}.home-breather{min-height:42vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px 10px}.breather-line{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:650;letter-spacing:-.045em}.home-breather .primary{min-width:150px}.period-emoji{font-size:1.45rem;display:inline-block;transform-origin:center;animation:periodRoll .65s ease both}.period-label{font-size:.78rem;overflow:hidden;white-space:nowrap;animation:periodLabelOut .8s ease both}@keyframes periodRoll{from{transform:rotate(-35deg) scale(.7)}to{transform:rotate(0) scale(1)}}@keyframes periodLabelOut{0%,45%{max-width:90px;opacity:1}100%{max-width:0;opacity:0}}.schedule-entry{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.schedule-entry:first-child{border-top:0}.schedule-entry .schedule-copy{flex:1;min-width:0}.schedule-entry .schedule-time{font-size:.8rem;color:var(--muted);min-width:90px}.schedule-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.schedule-days{display:flex;flex-wrap:wrap;gap:6px}.schedule-days label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:7px -bar i{display:block;height:100%;background:var(--done);border-radius:99px}.recap .primary{margin-top:14px}

function aiPrompt(){

 var hist=aiChat.msgs.slice(-20).map(function(m){return(m.r==="u"?"User: ":"Habita: ")+String(m.t).slice(0,500)}).join("\n");
 return "You are Bita, the friendly coach inside the Habita habit-tracking app. Talk like a warm, real person. Use the user's nickname sometimes, not every message. Keep replies short (under 70 words) and ask at most ONE question at a time.\n\nYou may chat freely: answer questions about habits, motivation, learning or their progress, ask your own questions to understand them, and give honest, realistic encouragement. Answer questions about their own progress from the context below (it is this user's own data and nobody else's). Use it to relate to them (celebrate wins, notice skipped habits kindly), but never invent facts that aren't in it. Never guarantee results. If they just want to talk, just talk; don't push goal setup.\n\nOnly when the user wants to start a NEW goal, gather these one at a time: (1) category, one of: "+cats+"; (2) what they want to achieve; (3) a target date, but only if the goal needs one. If they give a date, sanity-check it: each stage needs roughly 10 to 14 days of real practice, more if they have under 3 hours a week. If the date is too close for the path, say so kindly and offer a later date or fewer stages before moving on. For a casual or hobby goal with no real deadline, don't press for a date and leave it empty; (4) beginner, some experience, or experienced (skip this for habits and projects and set level to \"some\"); (5) whether they already have a course path or plan (if yes, ask them to list the stages; skip this for habits and projects). For a PROJECT (a school assignment, a portfolio, a trip) ask instead what it has to include and how it will be judged, and what is already done, then design the 3 to 6 steps from what is left, with the biggest or riskiest remaining step first and each step\'s own target date inside its outcome; (6) how much time they can set aside, phrased naturally as hours per week or per day and converted consistently; do not confuse study time with habit frequency; (7) ask how often they want the recurring habits to happen: daily, selected days / a number of times per week, or monthly where appropriate. Explain that goal duration and habit frequency are different (a 3-month goal can involve studying 4 days a week). If unsure, recommend a realistic frequency based on available time and let the user approve or change it. (8) when they want to start: today, tomorrow or a specific date. Ask this last, before the summary. If they are unsure, suggest tomorrow when it is already evening so day 1 is not half gone, otherwise today. The start date can never be in the past. Do not ask questions already answered. Do not ask for anything else for the goal. Also decide the goal's pace yourself (don't ask): \"relaxed\" for hobbies, crafts and casual curiosity with no real deadline (then deadline must be empty), or \"structured\" for exams, careers, income, or anything with a deadline or high stakes. The user can flip it on the goal card. Also decide the goal's type yourself (don't ask): \"skill\" for things to learn or exams (stages with checkpoints), \"habit\" for routines to build, like drinking water, sleeping earlier or walking daily (no stages: set stages to [] and skip questions 4 and 5), or \"project\" for one-off outcomes like planning a trip or finishing a portfolio (3 to 6 simple steps as stages, each with a short outcome, and no checkpoint needed). When you have everything, give a one-sentence summary and then on a new line output exactly: <<GOAL>>{\"name\":string,\"category\":categoryId,\"deadline\":\"YYYY-MM-DD\" or \"\",\"pace\":\"relaxed\"|\"structured\",\"kind\":\"skill\"|\"habit\"|\"project\",\"habits\":[{\"n\":string,\"a\":string,\"m\":number,\"days\":[0-6] or null}],\"level\":\"beginner\"|\"some\"|\"experienced\",\"weeklyHours\":number,\"start\":\"YYYY-MM-DD\",\"stages\":[{\"title\":string,\"outcome\":string,\"checkpoint\":string}]}<<END>> where stages is the user's own path, or if they have none, a realistic 4-6 stage path you design for their level (checkpoints must test ability, not time spent). Also include \"habits\": 1 or 2 (for a beginner) or 2 or 3 (otherwise) small, specific, repeatable actions for stage 1, chosen as the gentlest on-ramp for their level: for a beginner the first habit takes 10 to 15 minutes and needs no setup, installs or prior knowledge, nothing that needs a tool or hands-on lab appears until the basics behind it are covered, and any habit that is a big step up from the first is left out for a later stage (never one-off tasks or lessons), each with n (the action), a (a daily cue like \"After lunch\"), m (minutes, realistic for their weekly hours) and days (array of weekdays 0-6 with 0=Sunday, or null for every day). Never output that marker before you have everything, and never in ordinary chat. Do not change or promise changes to their existing habits; only suggest.\n\nDeadlines: if they mention more than one deadline, say they are behind, or say they do not know where to start, talk it through before creating anything. Get each item with its due date and what is already done, and how many hours a day they can really give. Add up the work against the time and say honestly if it will not all fit (suggest cutting scope or asking for more time). Order by due date and stakes. Then create the most urgent one first with the marker (its weeklyHours is its share of their time, not their total) and offer the next one after it is created. For a close deadline, size the sessions to the days left (longer or more frequent sessions, not more habits), the gentle-start rule does not apply, and start with one concrete step today.\n\nRemembering: when the user tells you something lasting that will help you plan for them (free hours, best time of day, what they struggle with, an upcoming deadline, what they enjoy), add on its own line <<NOTE>>a short plain fact<<END>> (at most one per reply, under 100 characters, never health, money or private details about other people). Adjusting: use the context below. If a goal\'s recent completion is low or they are behind on a deadline, kindly say so and offer ONE adjustment (shorter or fewer sessions, a different time, a re-plan or a later date) and ask if they want it. Never change or promise changes to habits yourself.\n\nToday is "+key(daysBack(0))+".\n\nAbout this user:\n"+aiUserContext()+"\n\nConversation so far:\n"+hist+"\nHabita:"}

function buildPlan(p){
 var dl=Math.ceil((new Date(p.deadline)-new Date())/86400000),days=Math.max(7,isFinite(dl)?dl:56),weeks=Math.max(1,Math.ceil(days/7));
 var total=Math.max(1,+p.hours||5);
 var goals=p.goals.filter(function(g){return g.trim()}).map(function(n){return{name:n.trim(),info:planKeyword(n.trim())}});
 var ut=(p.urgent||"").toLowerCase(),hasU=!!ut.trim();
 function urgentHit(g){return g.name.toLowerCase().split(/\W+/).filter(function(w){return w.length>3&&!/^(learn|better|more|study|become)$/.test(w)}).some(function(w){return ut.indexOf(w)>=0})}
 var primary=(hasU&&goals.find(urgentHit))||goals.find(function(g){return g.info.kind==="learning"})||goals[0];
 var sleep=goals.find(function(g){return g.info.kind==="sleep"&&g!==primary}),exercise=goals.find(function(g){return g.info.kind==="fitness"&&g!==primary});
 var items=[];
 function add(g,role,cls,reason){items.push({name:g.name,info:g.info,role:role,cls:cls,reason:reason,habits:[],queue:[]})}
 add(primary,"Primary","primary",hasU&&urgentHit(primary)?"You said this is time-sensitive, so it gets protected time first.":"The clearest goal to build first.");
 if(sleep)add(sleep,"Supporting","support","A steady sleep routine protects the energy every other goal needs.");
 if(exercise)add(exercise,"Maintenance","maintain","Keep movement sustainable without taking time from your priority goal.");
 // Prefer goals that directly support the primary skill and the user's stated income outcome.
 var supportFirst=goals.filter(function(g){return g!==primary&&(g.info.kind==="money"||g.info.kind==="confident")});
 var ordered=supportFirst.concat(goals.filter(function(g){return supportFirst.indexOf(g)<0}));
 ordered.forEach(function(g){if(items.some(function(i){return i.name===g.name}))return;
  add(g,"Supporting","support","This goal stays active alongside your other goals.")});
 var claimed={},pp=p;
 var studyT=p.studyTime||"18:00";
 if(inRange(studyT,p.busyStart,p.busyEnd))studyT=addMinutes(p.busyEnd,60);
 var mealEnd=addMinutes(p.busyEnd||"16:00",+p.mealMins||60);
 if(studyT>=(p.busyEnd||"16:00")&&studyT<mealEnd)studyT=mealEnd;
 function pick(item,count,mins){var ranked=rank(poolFor(item.info,item.name),mins,matchObs(p.obstacle,obsList(item.info))),out=[];
  for(var i=0;i<ranked.length&&out.length<count;i++){var h=ranked[i];
   if(h.k&&claimed[h.k]){if(claimed[h.k].also.indexOf(item.name)<0)claimed[h.k].also.push(item.name);continue}
   var e={n:h.n,a:h.a,m:h.m,k:h.k||"",also:[],time:timeFor(slotOf(h.a,h.n),pp)};if(h.k)claimed[h.k]=e;out.push(e)}
  return out}
 var block=Math.min(120,Math.max(30,Math.round(total*60*0.6/(weeks>4?4:3)))),activeDays=Math.min(5,Math.max(3,Math.round(total/3)));
 items.forEach(function(it){
  if(it.role==="Primary"){
   it.habits.push({n:(it.info.kind==="learning"?"Study block: ":"Focus block: ")+it.name+" ("+block+" min)",a:"At "+studyT,m:block,base:(it.info.kind==="learning"?"Study block: ":"Focus block: ")+it.name,block:block,k:"",also:[],time:studyT,days:({3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5]})[activeDays]});
   it.habits=it.habits.concat(pick(it,1,10).map(function(e){if(!e.time)e.time=addMinutes(studyT,-10);return e}))}
  else if(it.role==="Supporting")it.habits=pick(it,2,10);
  else if(it.role==="Maintenance"){it.habits=pick(it,1,5);if(it.habits[0]&&it.info.kind==="fitness")it.habits[0].time=p.exerciseTime||it.habits[0].time}
  else it.queue=pick(it,3,10)});

function autoArrangePlanWithAI(){

 var P=planner;

  P.scheduleBusy=false;P.scheduleStatus="Habita arranged a first-pass schedule from your stated routine. Bita’s scheduling help will be available when she’s back online.";render();return;
 }
 P.scheduleBusy=true;P.scheduleStatus="";render();
 var tasks=[];P.result.items.forEach(function(it){(it.habits||[]).forEach(function(h){tasks.push({goal:it.name,habit:h.n,minutes:Math.max(5,+h.m||10),currentTime:h.time||""})})});
 var prompt="You are Habita's schedule planner. Arrange the user's proposed habits at realistic local clock times. Use ONLY the user-provided routine/preferences below. Never schedule during work/school, before day start, or at/after sleep. Respect preferred focus and exercise times, energy preference, meal buffer, habit durations, and the total available hours. Avoid overlapping sessions; leave reasonable transition gaps. Keep the current time if it already fits. If a task cannot fit, choose the closest realistic slot and mark it as needsReview rather than inventing availability. Return ONLY valid JSON: {\"items\":[{\"goal\":string,\"habit\":string,\"time\":\"HH:MM\",\"needsReview\":boolean,\"reason\":string}]}. Include each task exactly once. Do not add or remove tasks.\nRoutine: day starts "+P.dayStart+", sleep "+P.sleepTime+", work/school "+P.busyStart+"–"+P.busyEnd+", main focus preference "+P.studyTime+", exercise preference "+P.exerciseTime+", energy "+(P.energy||"not specified")+", evening meal duration "+P.mealMins+" minutes, available time "+P.hours+" hours/week.\nTasks: "+JSON.stringify(tasks);
 window.habitaAI.ask(prompt).then(function(answer){
  if(!planner||!planner.result)return;
  var raw=String(answer||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/i,"");
  var obj=JSON.parse(raw),items=Array.isArray(obj.items)?obj.items:[],used={};
  items.forEach(function(it){if(!it||!/^\d{2}:\d{2}$/.test(it.time||""))return;var target=null;
   planner.result.items.some(function(g){if(g.name!==it.goal)return false;return(g.habits||[]).some(function(h){if(h.n===it.habit&&!used[g.name+"|"+h.n]){target=h;used[g.name+"|"+h.n]=1;return true}return false})});
   if(!target)return;var pp=planner,tm=it.time;
   if(inRange(tm,pp.busyStart,pp.busyEnd)||tm<pp.dayStart||tm>=pp.sleepTime)return;
   target.time=tm;target.a="At "+tm;target.scheduleNeedsReview=!!it.needsReview;target.scheduleReason=String(it.reason||"").slice(0,160);
  });
  planner.scheduleStatus="Habita arranged the proposed times using your routine and preferences. Review them before applying the plan.";
 }).catch(function(){if(planner)planner.scheduleStatus="Bita’s scheduling help wasn't available this time, so Habita kept its routine-based schedule. You can still review the times."}).finally(function(){if(planner){planner.scheduleBusy=false;render()}})
}

/* ---------- growth awards: granted only from real records ---------- */
function isSkillGoal(g){return g.kind!=="habit"&&g.kind!=="project"}
function dayAdd(k,n){var d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return key(d)}
function checkGrowthAwards(){
 if(!state.start||!state.ach)return;
 var today=key(daysBack(0)),goals=state.goals||[],done=goals.filter(function(g){return g.completed});
 /* Goal achievement */
 if(goals.some(function(g){return (g.stageHistory||[]).length>=1}))award("first-milestone","First Milestone",{category:"Goal achievement"});
 if(done.length>=1)award("goal-accomplished","Goal Accomplished",{category:"Goal achievement",note:done[0].name});
 if(done.length>=2)award("multi-talented","Multi-Talented",{category:"Goal achievement"});
 /* Learning and skill */
 var skillDays=0;
 goals.filter(isSkillGoal).forEach(function(g){var seen={};(g.habits||[]).forEach(function(h){Object.keys(h.done||{}).forEach(function(k){if(h.done[k])seen[k]=1})});skillDays+=Object.keys(seen).length;
  var pr=(g.path&&g.path.progress)||{};Object.keys(pr).forEach(function(i){var r=pr[i]||{};if(r.evidence&&String(r.evidence).trim())award("first-practical-project","Putting It to Work",{category:"Learning and skill",note:g.name});if(r.passed)award("theory-to-practice","Theory to Practice",{category:"Learning and skill",note:g.name})})});
 if(skillDays>=1)award("curious-mind","Curious Mind",{category:"Learning and skill"});
 if(skillDays>=20)award("knowledge-seeker","Knowledge Seeker",{category:"Learning and skill"});
 /* Resilience */
 allHabits().forEach(function(x){if(x.h.retired)return;var ks=Object.keys(x.h.done||{}).filter(function(k){return x.h.done[k]}).sort();for(var i=1;i<ks.length;i++){if(Math.round((new Date(ks[i]+"T12:00:00")-new Date(ks[i-1]+"T12:00:00"))/86400000)>=7){award("back-on-track","Back on Track",{category:"Resilience",note:x.h.name||""});break}}});
 (state.adapted||[]).forEach(function(a){if(dayAdd(a,7)>today)return;var n=0;for(var i=1;i<=7;i++)if(flag(dayAdd(a,i)))n++;if(n>=5)award("adapt-and-grow","Adapt and Grow",{category:"Resilience",date:dayAdd(a,7)})});
 var hard={low:1,tired:1,frustrated:1,stressed:1};
 Object.keys(state.moods||{}).forEach(function(d){if(!hard[state.moods[d]]||d>today)return;var hardDays=0,okDays=0;for(var i=0;i<7;i++){var k=dayAdd(d,-i);if(hard[state.moods[k]])hardDays++;if(flag(k))okDays++}if(hardDays>=4&&okDays>=4)award("kept-going","Kept Going",{category:"Resilience",date:d})});
 /* Reflection and self-awareness */
 var weeks=0,run=0;for(var w=0;w<120;w++){var s0=dayAdd(state.start,w*7);if(dayAdd(s0,6)>=today)break;var c=0;for(var j=0;j<7;j++)if(flag(dayAdd(s0,j)))c++;if(c>=5){run++;if(run>=4){award("found-my-rhythm","Found My Rhythm",{category:"Reflection and self-awareness",date:dayAdd(s0,6)});break}}else run=0}
 Object.keys(state.journal||{}).forEach(function(k){if(wc(state.journal[k])>=40&&k<=today&&dueCount(k)>0&&!flag(k))award("honest-with-myself","Honest With Myself",{category:"Reflection and self-awareness",date:k,journalDate:k,note:String(state.journal[k]).slice(0,300)})});
 /* Personal growth */
 var live=goals.filter(function(g){return !g.locked&&g.activated});
 if(live.filter(function(g){return goalProgress(g)>=.25}).length>=2)award("multi-goal-progress","Growing in Different Directions",{category:"Personal growth"});
 if(done.some(function(g){return g.kind==="project"}))award("independent-doer","Independent Doer",{category:"Personal growth"});
 var long_=live.filter(function(g){return goalProgress(g)>=.75&&g.activated<=dayAdd(today,-60)});
 if(long_.length>=2)award("becoming","Becoming",{category:"Personal growth"});
 var act=live.filter(function(g){return !g.completed&&g.activated<=dayAdd(today,-14)});
 if(act.length>=3&&act.every(function(g){var t=0,n=0;(g.habits||[]).forEach(function(h){if(h.retired)return;for(var i=1;i<=14;i++){var d=daysBack(i);if(sched(h,d)){t++;if(h.done[key(d)])n++}}});return t>0&&n/t>=.6}))award("finding-balance","Finding Balance",{category:"Personal growth"});
}
