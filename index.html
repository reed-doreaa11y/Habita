<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1624"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Habita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--ink:#1b2a41;--muted:#6b7a90;--line:#d9e1ec;--accent:#2f5bea;--done:#1f9d6b;--done-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#182237;--ink:#e8eef9;--muted:#8d9bb3;--line:#2a3750;--accent:#7b9cff;--done:#3cc590;--done-ink:#0f1624}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#182237;--ink:#e8eef9;--muted:#8d9bb3;--line:#2a3750;--accent:#7b9cff;--done:#3cc590;--done-ink:#0f1624}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:1.25rem;font-weight:800}
.sub{color:var(--muted);margin:4px 0 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.gtitle{font-size:1.2rem;font-weight:800}
.why{margin:2px 0 0;color:var(--muted);font-size:.9rem;font-style:italic}
.head,.row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:center}
.head{padding:10px 0 6px;color:var(--muted);font-size:.8rem;text-align:center}
.head span.today{color:var(--accent);font-weight:800}
.row{padding:12px 0;border-top:1px solid var(--line);row-gap:10px}
.row .name{grid-column:1/-1}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.streak{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.streak.on{color:var(--done)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--done-ink);cursor:pointer;padding:0;justify-self:center;font:inherit;font-size:.85rem;font-weight:800}
.dot:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dot.on{background:var(--done);border-color:var(--done)}
.dot.today{border-color:var(--accent)}
.dot.on.today{border-color:var(--done)}
.empty{padding:20px 0;text-align:center;color:var(--muted)}
input[type=text],input[type=number],select,textarea{flex:1;min-width:0;width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=checkbox]{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
button.primary{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer}
button.wide{width:100%}
.tools{display:flex;justify-content:flex-end;margin-top:12px}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;padding:4px 0}
.del{background:none;border:0;color:#d64545;font:inherit;font-size:.8rem;cursor:pointer;padding:2px 0}
.lbl{font-weight:600;display:block;margin:14px 0 8px}
.chips,.opts{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.opts button{font:inherit;font-weight:600;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button.sel{border-color:var(--accent);color:var(--accent)}
.opts button{flex:1 1 45%;text-align:left}
.pick{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.pick small{display:block;color:var(--muted);font-weight:400}
.pick span{font-weight:600}
.clock{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 14px}
.mins{display:flex;gap:8px;margin:12px 0}
.mins button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mins button.sel{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);margin:10px 0 0;font-size:.9rem;text-align:center}
.note.left{text-align:left;margin:6px 0 0}
.ok{color:var(--done)}
.err{color:#d64545}
.gbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gbar i{display:block;height:100%;background:var(--accent)}
.book{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.logrow,.eform{display:flex;gap:8px;margin-top:10px}
.btnrow{display:flex;gap:8px;align-items:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.plan-grid{display:grid;gap:10px;margin-top:10px}.plan-goal{display:flex;gap:8px;align-items:center}.plan-goal input{min-width:0}.mini{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:8px}.priority{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:800;margin-right:6px}.priority.primary{background:var(--accent);color:#fff}.priority.support{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}.priority.maintain{background:var(--line);color:var(--ink)}.priority.later{background:var(--line);color:var(--muted)}.plan-note{padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:8px;color:var(--muted);font-size:.9rem}.plan-list{display:grid;gap:10px}.plan-item{border-top:1px solid var(--line);padding-top:10px}.plan-item:first-child{border-top:0;padding-top:0}.plan-item strong{display:block}.plan-meta{font-size:.85rem;color:var(--muted);margin-top:3px}.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.plan-summary{font-size:.95rem}.question{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.question:first-child{border-top:0;padding-top:0;margin-top:0}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.time-grid input{width:100%}.schedule{display:grid;gap:8px}.schedule-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:10px}.schedule-row strong{font-size:.9rem}.schedule-row span{color:var(--muted);font-size:.85rem;text-align:right}.date-row{display:flex;gap:8px;align-items:center}.date-row input{flex:1}

main{padding-bottom:104px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:600}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.ttime{width:44px;flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tmain{min-width:0;flex:1}
.check{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--done-ink);cursor:pointer;padding:0;font:inherit;font-size:1rem;font-weight:800}
.check.on{background:var(--done);border-color:var(--done)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;background:var(--line);color:var(--ink)}
.badge.primary{background:var(--accent);color:#fff}
.badge.support{background:var(--done);color:var(--done-ink)}
.notice{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--accent)}
.notice p{margin:0;flex:1}
.dot.off{opacity:.35}
.hlist{list-style:none;margin:8px 0 0;padding:0}
.hlist li{padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.hlist li:first-child{border-top:0}
.hlist small{display:block;color:var(--muted)}
.pitem{border-top:1px solid var(--line);padding:12px 0}
.pitem:first-of-type{border-top:0}
.pitem h3{margin:0 0 4px;font-size:1.05rem}
.pitem p{margin:2px 0;color:var(--muted);font-size:.9rem}
.sect{font-weight:800;margin:16px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{resize:vertical;min-height:120px}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:#f5b301;border:2px solid #d99a00;vertical-align:-.12em;margin-right:6px}
button,input,select,textarea,label{scroll-margin-bottom:104px}
.time-in{width:auto;max-width:130px;padding:6px 8px;margin-top:6px}

.award-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.award{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);min-height:138px}.award.locked{opacity:.48}.award-icon{font-size:2rem;line-height:1;margin-bottom:10px}.award-title{font-weight:800;font-size:.95rem}.award-desc{color:var(--muted);font-size:.8rem;margin-top:4px}.award-date{color:var(--muted);font-size:.72rem;margin-top:10px}.profile-hero{display:flex;align-items:center;gap:14px}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);font-size:1.7rem}.profile-stat{background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:12px;padding:10px}.profile-stat strong{display:block;font-size:1.1rem}.profile-stat span{display:block;color:var(--muted);font-size:.75rem}.milestone-box{border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:14px;padding:12px;margin-top:12px}.milestone-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.account-head{display:flex;align-items:center;gap:12px}.account-dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:1.4rem}.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700}.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}.status.ok i{background:var(--done)}.status.warn i{background:#f5b301}.status.err i{background:#d64545}.stack{display:grid;gap:8px}.small-input{font-size:.88rem}.danger-box{border-color:#d64545}.muted-box{background:color-mix(in srgb,var(--muted) 5%,transparent)}.release-list{display:grid;gap:8px;margin-top:10px}.release-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.release-item:first-child{border-top:0}.release-item b{font-size:.9rem}.release-item span{color:var(--muted);font-size:.82rem;display:block}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:.75rem;font-weight:800}
</style>
</head>
<body>
<main><div id="view"></div></main>
<nav aria-label="Main">
<button type="button" data-act="nav" data-v="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v16M11 9h5"/></svg>Journal</button>
<button type="button" data-act="nav" data-v="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Habits</button>
<button type="button" data-act="nav" data-v="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
<button type="button" data-act="nav" data-v="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>
<script>
var $=function(i){return document.getElementById(i)};
var PPM=0.5,KEY="habita-v2",OLD="habit-tracker-v1",editing=false,wiz=null,planner=null,view="journal";

/* ---------- starter library (k = shared habit that serves several goals) ---------- */
var LIB={
 confident:{name:"Be confident",obs:["Fear of judgment","Overthinking","Low energy","Don't know where to start"],habits:[
  {n:"Stand tall for 1 minute",a:"After brushing your teeth",m:1,o:["Low energy","Don't know where to start"]},
  {n:"Say hello first to someone",a:"When you meet someone today",m:1,o:["Fear of judgment"]},
  {n:"Take 5 slow breaths",a:"Before something nerve-racking",m:2,o:["Overthinking","Fear of judgment"],k:"breathe"},
  {n:"Say one thing out loud in a conversation or meeting",a:"At your next meeting or chat",m:2,o:["Fear of judgment"]},
  {n:"Write down one thing you did well",a:"Before bed",m:2,o:["Overthinking","Fear of judgment"]},
  {n:"Do one small thing that scares you a little",a:"Before lunch",m:5,o:["Fear of judgment","Overthinking"]},
  {n:"Read or speak out loud for 5 minutes",a:"After coffee",m:5,o:["Don't know where to start","Low energy"]}]},
 reading:{name:"Read more",obs:["Phone pulls me away","No time","Get bored","Forget to do it"],habits:[
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["Phone pulls me away"],k:"phone-charge"},
  {n:"Read 1 page",a:"In bed, before sleep",m:1,o:["Get bored","Forget to do it","Phone pulls me away"]},
  {n:"Put your book where you will see it",a:"Every morning",m:1,o:["Forget to do it"]},
  {n:"Write one line about what you read",a:"After you read",m:2,o:["Get bored"]},
  {n:"Read 5 minutes instead of scrolling",a:"When you reach for your phone",m:5,o:["Phone pulls me away","No time"]},
  {n:"Read for 10 minutes",a:"After dinner",m:10,o:["Phone pulls me away","Forget to do it"]}]},
 fitness:{name:"Get fitter",obs:["No energy","No time","Get bored","Forget to do it"],habits:[
  {n:"Put on your workout clothes",a:"First thing after waking up",m:1,o:["No energy","Forget to do it"]},
  {n:"Drink a glass of water",a:"Before each meal",m:1,o:["Forget to do it"]},
  {n:"Do 10 squats or push-ups",a:"After brushing your teeth",m:2,o:["No time","Forget to do it"]},
  {n:"Stretch for 3 minutes",a:"Before bed",m:3,o:["No energy","Forget to do it"]},
  {n:"Do 5 minutes of movement",a:"After coffee",m:5,o:["No time","No energy"]},
  {n:"Walk for 10 minutes",a:"After lunch",m:10,o:["Get bored","No energy"],k:"walk"}]},
 focus:{name:"Focus better",obs:["My phone","Overwhelmed","Tired","Don't know where to start"],habits:[
  {n:"Close extra tabs and apps",a:"Before you start",m:1,o:["My phone","Overwhelmed"]},
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["My phone"],k:"phone-charge"},
  {n:"Write the one thing that matters today",a:"First thing, with coffee",m:2,o:["Overwhelmed","Don't know where to start"]},
  {n:"Write tomorrow's top task and worries down",a:"30 minutes before bed",m:3,o:["Overwhelmed","Don't know where to start"],k:"plan-tomorrow"},
  {n:"Take a real 5-minute break away from screens",a:"After each work block",m:5,o:["Tired"]},
  {n:"Work in a 10-minute sprint",a:"Once the first task is open",m:10,o:["Tired","Don't know where to start"]},
  {n:"Walk for 10 minutes",a:"After lunch",m:10,o:["Tired"],k:"walk"},
  {n:"Phone in another room for 25 minutes",a:"When you start work",m:25,o:["My phone"]}]},
 sleep:{name:"Sleep better",obs:["Phone in bed","Racing thoughts","Irregular schedule","Caffeine late"],habits:[
  {n:"Charge your phone across the room",a:"Before bed",m:1,o:["Phone in bed"],k:"phone-charge"},
  {n:"Lights low and screens off",a:"30 minutes before bed",m:1,o:["Phone in bed","Irregular schedule"]},
  {n:"Get into bed at the same time",a:"Same time every night",m:1,o:["Irregular schedule"]},
  {n:"No caffeine after lunch",a:"After lunch",m:1,o:["Caffeine late"]},
  {n:"Take 5 slow breaths",a:"After getting into bed",m:2,o:["Racing thoughts"],k:"breathe"},
  {n:"Write tomorrow's top task and worries down",a:"30 minutes before bed",m:3,o:["Racing thoughts"],k:"plan-tomorrow"}]}
};
var LEARN_OBS=["Don't know where to start","Lose motivation","Phone","Forget to do it"];
var LEARN=[
 {n:"Open your materials and start (just 5 minutes)",a:"At your study time",m:5,o:["Don't know where to start","Lose motivation"],k:"learn-open"},
 {n:"Put your phone away while you study",a:"When you start studying",m:1,o:["Phone"],k:"learn-phone"},
 {n:"Review yesterday's notes",a:"Before you start new material",m:5,o:["Forget to do it"],k:"learn-review"},
 {n:"Do one practice problem or exercise",a:"After you open your materials",m:10,o:["Lose motivation","Don't know where to start"],k:"learn-practice"},
 {n:"Write a 3-line summary of what you learned",a:"After you study",m:3,o:["Forget to do it","Lose motivation"],k:"learn-summary"}];
var GEN_OBS=["Don't know where to start","No time","Forget to do it","Lose motivation"];
var MONEY=[
 {n:"Write down what you spent today",a:"Before bed",m:2,o:["Forget to do it","No time"]},
 {n:"Check your budget for 2 minutes",a:"After breakfast",m:2,o:["Don't know where to start","Forget to do it"]},
 {n:"Move a small amount to savings",a:"When you get paid",m:2,o:["Lose motivation"]},
 {n:"Note one idea to earn more",a:"After lunch",m:5,o:["Don't know where to start","Lose motivation"]}];
function genPool(n){return[
 {n:"Spend 2 minutes on it, no more",a:"After coffee",m:2,o:["No time","Lose motivation"]},
 {n:"Set out what you need for tomorrow",a:"Before bed",m:2,o:["Forget to do it","No time"]},
 {n:"Write one line about how it went",a:"Before bed",m:2,o:["Lose motivation","Forget to do it"]},
 {n:"Tell someone what you did today",a:"In the evening",m:2,o:["Lose motivation"]},
 {n:"Take one small step toward: "+n,a:"After breakfast",m:5,o:["Don't know where to start","Lose motivation"]},
 {n:"Work on it for 10 minutes",a:"After lunch",m:10,o:["Don't know where to start"]}]}
var OBSMAP=[[/forget|remember/,["Forget to do it"]],[/phone|scroll|distract/,["Phone pulls me away","My phone","Phone in bed","Phone"]],[/tired|energy|exhaust/,["Low energy","No energy","Tired"]],[/time|busy/,["No time"]],[/bored/,["Get bored"]],[/overplan|overwhelm|too much/,["Overwhelmed","Overthinking"]],[/motivat|give up|quit|lazy|consisten/,["Lose motivation"]],[/start/,["Don't know where to start"]]];
function matchObs(t,list){t=(t||"").toLowerCase();for(var i=0;i<OBSMAP.length;i++)if(OBSMAP[i][0].test(t))for(var j=0;j<OBSMAP[i][1].length;j++)if(list.indexOf(OBSMAP[i][1][j])>=0)return OBSMAP[i][1][j];return""}
function planKeyword(name){var x=name.toLowerCase();
 if(/\b(sleep|bed|rest)/.test(x))return{kind:"sleep",lib:"sleep"};
 if(/\b(money|save|saving|business|freelanc|income|earn)/.test(x))return{kind:"money"};
 if(/\b(exercise|fitness|fit|workout|gym|run|weight)/.test(x))return{kind:"fitness",lib:"fitness"};
 if(/\b(read|book)/.test(x))return{kind:"reading",lib:"reading"};
 if(/confiden|\b(shy|speak|social)/.test(x))return{kind:"confident",lib:"confident"};
 if(/\b(focus|concentrat|procrastinat|distract)/.test(x))return{kind:"focus",lib:"focus"};
 if(/\b(stat|exam|test|course|study|school|learn|python|revit|autocad|skill|certif)/.test(x))return{kind:"learning"};
 return{kind:"other"}}
function poolFor(info,name){return info.lib?LIB[info.lib].habits:info.kind=="learning"?LEARN:info.kind=="money"?MONEY:genPool(name)}
function obsList(info){return info.lib?LIB[info.lib].obs:info.kind=="learning"?LEARN_OBS:GEN_OBS}
function rank(pool,mins,obs){var p=pool.map(function(h){return Object.assign({},h)}),fit=p.filter(function(h){return h.m<=mins});
 if(fit.length<3)fit=p.slice().sort(function(a,b){return a.m-b.m}).slice(0,3);
 fit.forEach(function(h,i){h._s=((h.o||[]).indexOf(obs)>=0?10:0)-i*0.01});
 return fit.sort(function(a,b){return b._s-a._s})}

/* ---------- state ---------- */
function load(){
 var s=null;
 try{var r=localStorage.getItem(KEY);if(r){s=JSON.parse(r);if(!(s&&s.goals))s=null}}catch(e){}
 if(!s){s={goals:[],mins:{}};
  try{var o=JSON.parse(localStorage.getItem(OLD)||"null");if(o){s.mins=o.mins||{};

 function urgentHit(g){return g.name.toLowerCase().split(/\W+/).filter(function(w){return w.length>3&&!/^(learn|better|more|study|become)$/.test(w)}).some(function(w){return ut.indexOf(w)>=0})}

 add(primary,"Primary","primary",hasU&&urgentHit(primary)?"You said this is time-sensitive, so it gets protected time first.":"The clearest goal to build first.");
 if(sleep)add(sleep,"Supporting","support","A steady sleep routine protects the energy every other goal needs.");
 if(exercise)add(exercise,"Maintenance","maintain","Keep movement sustainable without taking time from your priority goal.");
 goals.forEach(function(g){if(items.some(function(i){return i.name===g.name}))return;
  if(items.length<3)add(g,"Supporting","support","Gets a small share of your day right now.");else add(g,"Later","later","Waits in the queue. Its habits unlock one at a time.")});
 var claimed={},pp=p;

 if(inRange(studyT,p.busyStart,p.busyEnd))studyT=addMinutes(p.busyEnd,60);
 var mealEnd=addMinutes(p.busyEnd||"16:00",+p.mealMins||60);

 function pick(item,count,mins){var ranked=rank(poolFor(item.info,item.name),mins,matchObs(p.obstacle,obsList(item.info))),out=[];
  for(var i=0;i<ranked.length&&out.length<count;i++){var h=ranked[i];

   var e={n:h.n,a:h.a,m:h.m,k:h.k||"",also:[],time:timeFor(slotOf(h.a,h.n),pp)};if(h.k)claimed[h.k]=e;out.push(e)}

   it.habits=it.habits.concat(pick(it,1,10).map(function(e){if(!e.time)e.time=addMinutes(studyT,-10);return e}))}
  else if(it.role==="Supporting")it.habits=pick(it,2,10);
  else if(it.role==="Maintenance"){it.habits=pick(it,1,5);if(it.habits[0]&&it.info.kind==="fitness")it.habits[0].time=p.exerciseTime||it.habits[0].time}

  async function configure(cfg){localStorage.setItem(cfgKey,JSON.stringify(cfg));app=null;auth=null;db=null;configured=false;await ensure();return true}
  async function googleLogin(){await ensure();var provider=new window.habitaCloud._mods.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});var r=await window.habitaCloud._mods.auth.signInWithPopup(auth,provider);user=r.user;var local=window.state,remote=await syncNow(local);
    if(remote&&remote!==local){
      window.state=remote;try{window.localStorage.setItem(window.KEY||"habita-v2",JSON.stringify(remote))}catch(e){}
    }
    if(window.render)window.render();
    return user}
  async function signOut(){await ensure();await window.habitaCloud._mods.auth.signOut();user=null}
  async function syncNow(local){await ensure();if(!user)throw new Error("Sign in first.");var ref=window.habitaCloud._mods.fire.doc(db,"users",user.uid);var snap=await window.habitaCloud._mods.fire.getDoc(ref);if(snap.exists())return snap.data().state||null;await window.habitaCloud._mods.fire.setDoc(ref,{state:local||window.state,updatedAt:window.habitaCloud._mods.fire.serverTimestamp()});return local||window.state}
  var timer=null;
  async function queueSave(st){if(!user)return;clearTimeout(timer);timer=setTimeout(async function(){try{await ensure();if(!user)return;var ref=window.habitaCloud._mods.fire.doc(db,"users",user.uid);await window.habitaCloud._mods.fire.setDoc(ref,{state:st,updatedAt:window.habitaCloud._mods.fire.serverTimestamp()},{merge:true})}catch(e){console.warn("Habita cloud sync",e)}},900)}
  function status(){return{configured:!!(configured||localStorage.getItem(cfgKey)||DEFAULT_CONFIG),signedIn:!!user,email:user?user.email:""}}
  ensure().catch(function(){});
  return{configure:configure,googleLogin:googleLogin,signOut:signOut,syncNow:syncNow,queueSave:queueSave,status:status};
})();
